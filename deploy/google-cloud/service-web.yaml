apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sysassist-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 200
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/sysassist/sysassist-web:latest
          ports:
            - name: http1
              containerPort: 4173
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
